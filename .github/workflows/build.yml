name: Build NetShelf APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          
      - name: Get dependencies
        run: cd netshelf && flutter pub get
        
      - name: Build APK
        run: cd netshelf && flutter build apk --release
        
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: netshelf-apk
          path: netshelf/build/app/outputs/flutter-apk/app-release.apk

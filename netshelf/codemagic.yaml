workflows:
  android-workflow:
    name: NetShelf Android Build
    environment:
      flutter: 3.24.0
      java: 17
    scripts:
      - name: Get Flutter
        script: |
          flutter --version
      - name: Get dependencies
        script: |
          cd netshelf
          flutter pub get
      - name: Build APK
        script: |
          cd netshelf
          flutter build apk --release
    artifacts:
      - netshelf/build/app/outputs/flutter-apk/app-release.apk
